<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard UI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #3a1c71, #4a4fcf, #5f2c82);
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .title {
            text-align: center;
            color: white;
            font-size: 42px;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .logo {
            font-weight: 600;
            color: #555;
        }

        .btns button {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            background: #eef1ff;
            margin-left: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: .3s;
        }

        .btns button:hover {
            background: #5b6cff;
            color: white;
        }

        h2 {
            margin-bottom: 16px;
            color: #333;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 22px;
        }

        .stat {
            padding: 14px 10px;
            border-radius: 12px;
            color: white;
            text-align: center;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
        }

        .blue {
            background: linear-gradient(135deg, #4a4fcf, #6c63ff);
        }

        .orange {
            background: linear-gradient(135deg, #ffb347, #ffcc33);
        }

        .green {
            background: linear-gradient(135deg, #43cea2, #185a9d);
        }

        .stat h3 {
            font-size: 22px;
        }

        .stat p {
            font-size: 12px;
            opacity: .9;
        }

        .section-title {
            margin: 12px 0;
            font-weight: 600;
            color: #555;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .action {
            background: #f3f6ff;
            padding: 16px 10px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, .12);
            cursor: pointer;
            transition: .3s;
        }

        .action:hover {
            transform: translateY(-3px);
            background: #5b6cff;
            color: white;
        }

        .icon {
            font-size: 26px;
            margin-bottom: 6px;
        }

        @media(max-width:420px) {
            .title {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="title">DASHBOARD</div>

        <div class="card">

            <div class="topbar">
                <div class="logo">📘 Task</div>
                <div class="btns">
                    <button>Settings</button>
                    <button  onclick="Logout()">Logout</button>
                </div>
            </div>

            <h2>Welcome, Rao Sahab! 👋</h2>

            <div class="stats">
                <div class="stat blue">
                    <h3>10</h3>
                    <p>Total Projects</p>
                </div>
                <div class="stat orange">
                    <h3>15</h3>
                    <p>Pending Tasks</p>
                </div>
                <div class="stat green">
                    <h3>185</h3>
                    <p>New Contacts</p>
                </div>
            </div>

            <div class="section-title">Quick Actions</div>

            <div class="actions">
                <div class="action">
                    <div class="icon">➕</div>
                    <p>Add Project</p>
                </div>
                <div class="action">
                    <div class="icon">⭐</div>
                    <p>Favourite Tasks</p>
                </div>
                <div class="action">
                    <div class="icon">👤</div>
                    <p>Manage Contacts</p>
                </div>
            </div>

            <div class="section-title">Quick Actions</div>

            <div class="actions">
                <div class="action">
                    <div class="icon">📌</div>
                    <p>Pin Project</p>
                </div>
                <div class="action">
                    <div class="icon">📋</div>
                    <p>View Tasks</p>
                </div>
                <div class="action">
                    <div class="icon">👥</div>
                    <p>Merge Contacts</p>
                </div>
            </div>

        </div>
    </div>
<script src="Dashboard.js"></script>
</body>

</html>
